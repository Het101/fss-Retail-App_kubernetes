name: CI - Build and Scan

on:
  push:
    branches:
      - main
      - feature/*

jobs:
  build-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v2

    - name: SonarQube Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=your-org_project-name
          -Dsonar.organization=your-org
          -Dsonar.host.url=https://sonarcloud.io

    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker Image
      run: |
        docker build -t your-org/app:${{ github.sha }} .
        docker tag your-org/app:${{ github.sha }} your-org/app:latest

    - name: Push Docker Image
      run: |
        docker push your-org/app:${{ github.sha }}
        docker push your-org/app:latest

    - name: Trigger CD Workflow
      uses: peter-evans/repository-dispatch@v2
      with:
        token: ${{ secrets.REPO_DISPATCH_TOKEN }}
        repository: your-org/infra-repo
        event-type: update-build
        client-payload: '{"image_tag": "${{ github.sha }}"}'