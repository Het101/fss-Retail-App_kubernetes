name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - feature/*

jobs:
  native-build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: het101/frontend-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract short SHA
        id: sha
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ env.SHORT_SHA }} .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ env.SHORT_SHA }}

      - name: Push latest tag (optional)
        run: |
          docker tag $IMAGE_NAME:${{ env.SHORT_SHA }} $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest
      
      - name: Trigger InfraRepo to update values.yaml
        uses: peter-evans/repository-dispatch@v2
        with:
          repository: Het101/fss-Retail-App_kubernetes
          event-type: update-image-tag
          client-payload: |
            {
              "image_tag": "${{ env.SHORT_SHA }}",
              "image_url": "$IMAGE_NAME:${{ env.SHORT_SHA }}"
            }
