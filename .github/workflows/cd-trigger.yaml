name: CD - Update Infra Helm Chart

on:
  repository_dispatch:
    types: [update-build]

jobs:
  update-helm:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Infra Repo
      uses: actions/checkout@v2

    - name: Update Image Tag
      run: |
        echo "Updating image tag to ${{ github.event.client_payload.image_tag }}"
        sed -i "s/tag:.*/tag: ${{ github.event.client_payload.image_tag }}/" helm-chart/values.yaml

    - name: Commit and Push
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add helm-chart/values.yaml
        git commit -m "Update image tag to ${{ github.event.client_payload.image_tag }}"
        git push